; PlatformIO build for the smart room door.
; Compiles the SAME sketch.ino the browser version of Wokwi uses, so there is
; only one copy of the code. Open THIS folder (firmware/door-wokwi) in VS Code.
;
; There is nothing to edit per room. A door shows a pairing code when it starts,
; and an admin types that code in Admin -> Smart room -> Connect a room.

[platformio]
src_dir = .
default_envs = esp32

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; compile only the sketch - not the README, the diagram, or downloaded libraries.
; PlatformIO converts sketch.ino into a temporary sketch.ino.cpp and compiles
; THAT, so the converted file has to be allowed through the filter too.
build_src_filter = -<*> +<sketch.ino> +<sketch.ino.cpp>
lib_deps =
  chris--a/Keypad
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library
  madhephaestus/ESP32Servo
  bblanchon/ArduinoJson@^7
  adafruit/Adafruit NeoPixel
  knolleary/PubSubClient

; Simulated door: this is what the checkmark builds and what wokwi.toml runs.
; A simulator may start with empty flash each run, so the door's key is made
; once at build time and kept in .device-secret (not in git).
[env:esp32]
extra_scripts = pre:device_secret.py

; A real ESP32:  pio run -e board -t upload
; Each board makes its own key on first start, so this build holds no secret.
; Wi-Fi is set from a phone, through the door's own setup network.
[env:board]
build_flags = -D REAL_BOARD
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager
