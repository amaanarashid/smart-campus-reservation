; PlatformIO builds for the smart room device. Open THIS folder
; (firmware/door-wokwi) in VS Code.
;
; One firmware for every room. Which parts a room has (lock, keypad, screen,
; motion sensor, lights, air-con by relay or IR, temperature, LED ring) and on
; which pins comes from the app when an admin connects the device, so there is
; nothing to edit per room. Only the board is picked here:
;
;   esp32      Wokwi in VS Code (what wokwi.toml runs). Key from .device-secret.
;   wokwi-web  the same, for the app's "Simulated door" download (no key inside;
;              the app writes one in). Publishes to public/firmware/wokwi.
;   board      a real ESP32 DevKit. Publishes to public/firmware/esp32-devkit.
;   cam        a real AI-Thinker ESP32-CAM. Publishes to public/firmware/esp32-cam.
;
; The published builds can be installed from the browser:
; Admin -> Smart room -> Connect a room -> Set up a device. Commit
; public/firmware and deploy after building them.

[platformio]
src_dir = .
default_envs = esp32

[env]
platform = espressif32@^6       ; Arduino core 2.0.x (the code is tested on 2.0.17)
framework = arduino
monitor_speed = 115200
; IR support makes the app ~1.3 MB: use the 1.9 MB app partitions (keeps OTA possible)
board_build.partitions = min_spiffs.csv
; compile the sketch and its .cpp files - not the README, the diagram, or
; downloaded libraries. PlatformIO turns sketch.ino into sketch.ino.cpp.
build_src_filter = -<*> +<*.cpp> +<sketch.ino> +<sketch.ino.cpp>
lib_deps =
  chris--a/Keypad@^3.1.1
  adafruit/Adafruit SSD1306@^2.5.17
  adafruit/Adafruit GFX Library@^1.13.0
  madhephaestus/ESP32Servo@^3.2.1
  bblanchon/ArduinoJson@^7.4.3
  adafruit/Adafruit NeoPixel@^1.15.5
  knolleary/PubSubClient@^2.8
  crankyoldgit/IRremoteESP8266@^2.8.6
  adafruit/DHT sensor library@^1.4.6
  adafruit/Adafruit Unified Sensor@^1.1.14

[env:esp32]
board = esp32dev
build_flags = -D BOARD_WOKWI
extra_scripts = pre:device_secret.py

[env:wokwi-web]
board = esp32dev
build_flags = -D BOARD_WOKWI
extra_scripts = post:publish_web.py

; pio run -e board -t upload   (or install from the browser)
[env:board]
board = esp32dev
build_flags = -D BOARD_DEVKIT
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@^2.0.17
extra_scripts = post:publish_web.py

; pio run -e cam -t upload     (ESP32-CAM-MB USB board, or install from the browser)
[env:cam]
board = esp32cam
build_flags = -D BOARD_CAM
lib_deps =
  ${env.lib_deps}
  tzapu/WiFiManager@^2.0.17
extra_scripts = post:publish_web.py
